<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phishing Awareness Quiz</title>
<style>
body{font-family:Calibri,Arial,sans-serif;background:#F8FAFC;color:#0F172A;margin:0;padding:24px}
.box{max-width:640px;margin:auto;background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:24px}
h1{font-family:Cambria,serif;margin:0 0 4px}.sub{color:#475569;margin-bottom:16px}
.q{font-size:20px;font-weight:bold;margin:12px 0}
button.o{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border:1px solid #CBD5E1;border-radius:8px;background:#fff;font-size:16px;cursor:pointer}
button.o:hover{background:#FEF3C7}.ok{background:#D1FAE5!important;border-color:#059669!important}.bad{background:#FFE4E6!important;border-color:#E11D48!important}
.exp{margin-top:12px;padding:12px;background:#FEF3C7;border-radius:8px}
.nx{margin-top:14px;padding:10px 20px;border:0;border-radius:8px;background:#0F172A;color:#fff;font-size:16px;cursor:pointer}
.bar{height:6px;background:#E2E8F0;border-radius:3px;margin-bottom:12px}.bar div{height:6px;background:#F59E0B;border-radius:3px}
</style></head><body><div class="box" id="app"></div>
<script>
const Q=[
["You get an email from support@paypa1-secure.com saying your account will be suspended in 24 hours. What do you do?",["Click the link to verify","Reply with your details","Go to the official site by typing the address, and report the email","Forward it to colleagues"],2,"The sender domain is fake and the message creates urgency. Never use the link; open the real site yourself and report the email."],
["Which URL is the real Microsoft site?",["https://microsoft.com.account-verify.xyz/login","https://www.microsoft.com/en-us/","https://micros0ft.com","https://microsoft-support.net"],1,"The real domain is the part just before the first single slash. In the first option it is account-verify.xyz."],
["What is smishing?",["Phishing by phone call","Phishing by SMS text message","Phishing by QR code","Phishing by email attachment"],1,"Smishing = SMS + phishing. Vishing is by voice, quishing by QR code."],
["A website shows a padlock (HTTPS). Does that prove it is safe?",["Yes, always","No, it only means the connection is encrypted","Yes, if it is a .com site","Only on mobile"],1,"Attackers can also get HTTPS certificates. Check the domain name itself."],
["Which of these is NOT a red flag?",["A generic greeting like 'Dear Customer'","A threat to close your account today","A message you were expecting, from the exact known address, with a link matching the real site","A link whose real URL differs from the text"],2,"An expected message from a verified sender with a matching link is normal. Stay careful when in doubt."],
["An email 'from the CEO' asks you to buy gift cards urgently. Which tactic is mainly used?",["Authority (with urgency)","Curiosity","Helpfulness","Luck"],0,"Impersonating a boss uses authority and pressure. Verify through another channel before acting."],
["You clicked a link and typed your password. What is the first step?",["Ignore it","Change the password from a safe device and report it to IT","Delete the email only","Restart the computer"],1,"Act fast: change the password, enable MFA, report it, and check your accounts for strange activity."],
["Which measure best protects your account even if your password is stolen?",["A longer email address","Multi-factor authentication (MFA)","Clearing browser history","Using incognito mode"],1,"MFA requires a second proof, so a stolen password alone is not enough."]];
let i=0,score=0,app=document.getElementById('app');
function show(){
 if(i>=Q.length){const p=Math.round(score/Q.length*100);
  app.innerHTML=`<h1>Quiz complete</h1><p class="q">Score: ${score} / ${Q.length} (${p}%)</p><p>${p>=75?'Great job! You can spot most phishing attempts.':'Review the slides and try again.'}</p><button class="nx" onclick="i=0;score=0;show()">Try again</button>`;return}
 const q=Q[i];
 app.innerHTML=`<h1>Phishing Awareness Quiz</h1><div class="sub">Question ${i+1} of ${Q.length}</div><div class="bar"><div style="width:${i/Q.length*100}%"></div></div><div class="q">${q[0]}</div>`+
 q[1].map((o,k)=>`<button class="o" onclick="pick(${k})">${o}</button>`).join('')+`<div id="fb"></div>`;
}
function pick(k){
 const q=Q[i],b=document.querySelectorAll('button.o');
 b.forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add('ok');else if(j===k)x.classList.add('bad')});
 if(k===q[2])score++;
 document.getElementById('fb').innerHTML=`<div class="exp"><b>${k===q[2]?'Correct!':'Not quite.'}</b> ${q[3]}</div><button class="nx" onclick="i++;show()">${i===Q.length-1?'See result':'Next'}</button>`;
}
show();
</script></body></html>
